                                    <div className="relay-icon-badge"><i className="fa-solid fa-sun"></i></div>
                                    <div>
                                        <h4 style={{ fontSize: '15px', fontWeight: '700' }}>Relay 1 - BiLED Main Projector (55W)</h4>
                                        <p style={{ fontSize: '12px', color: 'var(--text-secondary)' }}>Blue Lens Cut-Off • Arus 4.5A • 12.6V DC</p>
                                    </div>
                                </div>
                                <label className="toggle-switch-ios">
                                    <input 
                                        type="checkbox" 
                                        checked={relays.biled} 
                                        onChange={(e) => {
                                            setRelays({ ...relays, biled: e.target.checked });
                                            onNotify(`BiLED Main Projector: ${e.target.checked ? 'ON' : 'OFF'}`, 'fa-sun');
                                        }} 
                                    />
                                    <span className="toggle-slider"></span>
                                </label>
                            </div>

                            {/* Relay 2 Foglamp */}
                            <div className={`relay-card-unit ${relays.fog ? 'is-fog-active' : ''}`}>
                                <div className="relay-identity">
                                    <div className="relay-icon-badge"><i className="fa-solid fa-cloud-sun"></i></div>
                                    <div>
                                        <h4 style={{ fontSize: '15px', fontWeight: '700' }}>Relay 2 - Laser Foglamp Dual (3000K)</h4>
                                        <p style={{ fontSize: '12px', color: 'var(--text-secondary)' }}>Kuning Pekat 3000K • Arus 2.8A • Tembus Hujan Deras</p>
                                    </div>
                                </div>
                                <label className="toggle-switch-ios">
                                    <input 
                                        type="checkbox" 
                                        checked={relays.fog} 
                                        onChange={(e) => {
                                            setRelays({ ...relays, fog: e.target.checked });
                                            onNotify(`Laser Foglamp: ${e.target.checked ? 'ON' : 'OFF'}`, 'fa-cloud-sun');
                                        }} 
                                    />
                                    <span className="toggle-slider amber-mode"></span>
                                </label>
                            </div>
                        </div>

                        {/* Strobe & Dimmer Emergency Flashers */}
                        <div className="glass-card">
                            <div className="card-header-flex">
                                <div className="card-title-group">
                                    <div className="card-icon-tag"><i className="fa-solid fa-bolt"></i></div>
                                    <div>
                                        <h3>Aksi Cepat &amp; Strobo Darurat</h3>
                                        <p>Fungsi pass-beam dan sinyal peringatan jalan raya</p>
                                    </div>
                                </div>
                            </div>
                            <div style={{ display: 'flex', gap: '12px', flexWrap: 'wrap' }}>
                                <button 
                                    className="btn-action-primary" 
                                    style={{ flex: 1, minWidth: '220px' }}
                                    onClick={() => {
                                        triggerFlash();
                                        onNotify("Pass Beam Flash 3x Diaktifkan!", "fa-high-definition");
                                    }}
                                >
                                    <i className="fa-solid fa-high-definition"></i> Pass Beam (Dim 3x Flash)
                                </button>
                                <button 
                                    className="btn-action-primary" 
                                    style={{ flex: 1, minWidth: '220px', background: 'rgba(245, 158, 11, 0.2)', border: '1px solid var(--neon-amber)', color: 'var(--neon-amber)' }}
                                    onClick={() => onNotify("Foglamp Strobo Darurat Aktif!", "fa-triangle-exclamation")}
                                >
                                    <i className="fa-solid fa-triangle-exclamation"></i> Strobo Foglamp Darurat
                                </button>
                            </div>
                        </div>
                    </div>
                </DashboardLayout>
            );
        }

        // ======================== SCREEN: STOPLAMP TAIL CONTROLLER ========================
        function StoplampScreen({ user, stopState, setStopState, onNotify }) {
            const [isBraking, setIsBraking] = useState(false);

            const stopRunningModes = [
                '1. Red Flowing Sweep',
                '2. Fast Strobe Alert',
                '3. Soft Red Wave',
                '4. Heartbeat Rhythm',
                '5. Crimson Flowing',
                '6. Sunset Dual Tone',
                '7. Breathing Pulse',
                '8. Deep Crimson Chase',
                '9. Neon Flash Blitz',
                '10. Cyber Red Matrix'
            ];

            const triggerBrakeTest = () => {
                setIsBraking(true);
                onNotify("Simulasi Tuas Rem Ditarik (F1 Flasher Active)!", "fa-hand");
                setTimeout(() => setIsBraking(false), 1400);
            };

            const getTailBarStyle = () => {
                if (isBraking) {
                    return {
                        background: '#ff0022',
                        boxShadow: '0 0 45px #ff0022, 0 0 90px #ff0022',
                        transform: 'scaleY(1.3)'
                    };
                }
                return {
                    background: stopState.color,
                    boxShadow: `0 0 25px ${stopState.color}, 0 0 50px ${stopState.color}aa`,
                    opacity: stopState.brightness / 100
                };
            };

            return (
                <DashboardLayout
                    user={user}
                    pageTitle="StopLamp Tail Controller"
                    pageDesc="Kustomisasi lampu kota belakang, 10 pola running, &amp; respon rem F1 Flasher"
                    onNotify={onNotify}
                >
                    <div className="view-content-canvas">
                        <div className="segmented-tabs-wrapper">
                            <button 
                                className={`segmented-btn ${stopState.mode === 'static' ? 'active' : ''}`}
                                onClick={() => {
                                    setStopState({ ...stopState, mode: 'static' });
                                    onNotify("StopLamp: Mode Static Standby", "fa-palette");
                                }}
                            >
                                <i className="fa-solid fa-palette"></i> Static Standby
                            </button>
                            <button 
                                className={`segmented-btn ${stopState.mode === 'running' ? 'active' : ''}`}
                                onClick={() => {
                                    setStopState({ ...stopState, mode: 'running' });
                                    onNotify("StopLamp: 10 Running Mode", "fa-bars-staggered");
                                }}
                            >
                                <i className="fa-solid fa-bars-staggered"></i> 10 Running Mode
                            </button>
                            <button 
                                className={`segmented-btn ${stopState.mode === 'brake' ? 'active' : ''}`}
                                onClick={() => {
                                    setStopState({ ...stopState, mode: 'brake' });
                                    onNotify("StopLamp: Respon Rem Otomatis", "fa-car-rear");
                                }}
                            >
                                <i className="fa-solid fa-car-rear"></i> Respon Rem Otomatis
                            </button>
                        </div>

                        {/* StopLamp Simulator */}
                        <div className="glass-card">
                            <div className="card-header-flex">
                                <div className="card-title-group">
                                    <div className="card-icon-tag" style={{ background: 'rgba(255, 51, 75, 0.1)', color: 'var(--neon-red)', borderColor: 'rgba(255, 51, 75, 0.3)' }}>
                                        <i className="fa-solid fa-car-rear"></i>
                                    </div>
                                    <div>
                                        <h3>StopLamp Belakang (Tail Light)</h3>
                                        <p>Simulasi pencahayaan bar LED belakang motor</p>
                                    </div>
                                </div>
                                <button className="pill-tab" onClick={triggerBrakeTest}>
                                    <i className="fa-solid fa-hand"></i> Tes Injak Tuas Rem
                                </button>
                            </div>

                            <div className="interactive-simulator-box" style={{ minHeight: '130px' }}>
                                <div className="stoplamp-tail-container">
                                    <div className="tail-led-bar" style={getTailBarStyle()}></div>
                                </div>
                                <div style={{ marginTop: '12px', fontSize: '11px', color: isBraking ? 'var(--neon-red)' : 'var(--text-secondary)' }}>
                                    {isBraking ? '⚠️ REM AKTIF: F1 FLASHING BLITZ 5X' : 'Status: Normal Red Tail Standby'}
                                </div>
                            </div>
                        </div>

                        {/* Subtabs Stoplamp */}
                        {stopState.mode === 'static' && (
                            <div className="controls-two-col">
                                <div className="glass-card">
                                    <div className="card-header-flex">
                                        <div>
                                            <h3>Warna Standby StopLamp</h3>
                                            <p>Standar keamanan disarankan warna Merah/Crimson</p>
                                        </div>
                                    </div>
                                    <div className="color-palette-grid">
                                        {['#ff334b', '#b91c1c', '#f97316', '#ec4899', '#a855f7', '#00f0ff'].map(c => (
                                            <div 
                                                key={c}
                                                className={`color-swatch-bubble ${stopState.color === c ? 'selected' : ''}`}
                                                style={{ background: c, color: c }}
                                                onClick={() => {
                                                    setStopState({ ...stopState, color: c });
                                                    onNotify(`Warna Stop: ${c}`, 'fa-palette');
                                                }}
                                            />
                                        ))}
                                    </div>
                                </div>

                                <div className="glass-card">
                                    <div className="card-header-flex">
                                        <div>
                                            <h3>Kecerahan Tail Light</h3>
                                            <p>Visibilitas lampu kota malam hari</p>
                                        </div>
                                    </div>
                                    <div className="slider-row-box">
                                        <div className="slider-header-label">
                                            <span>Brightness Standby</span>
                                            <span className="slider-val-pill">{stopState.brightness}%</span>
                                        </div>
                                        <input 
                                            type="range" 
                                            min="10" 
                                            max="100" 
                                            value={stopState.brightness} 
                                            onChange={(e) => setStopState({ ...stopState, brightness: Number(e.target.value) })}
                                        />
                                    </div>
                                    <button 
                                        className="btn-action-primary" 
                                        style={{ background: 'linear-gradient(135deg, var(--neon-red), #b91c1c)', color: '#fff' }}
                                        onClick={() => onNotify("Warna StopLamp disinkronkan ke ESP32!", "fa-paper-plane")}
                                    >
                                        <i className="fa-solid fa-paper-plane"></i> KIRIM KE STOPLAMP
                                    </button>
                                </div>
                            </div>
                        )}

                        {stopState.mode === 'running' && (
                            <div className="controls-two-col">
                                <div className="glass-card">
                                    <div className="card-header-flex">
                                        <div>
                                            <h3>10 Mode Running Belakang</h3>
                                            <p>Gelombang animasi dinamis lampu kota</p>
                                        </div>
                                    </div>
                                    <div className="mode-cards-grid" style={{ maxHeight: '360px' }}>
                                        {stopRunningModes.map((name, idx) => (
                                            <div 
                                                key={name}
                                                className={`mode-pill-card ${idx === 0 ? 'active' : ''}`}
                                                onClick={() => onNotify(`Pola Stop: ${name}`, 'fa-bars-staggered')}
                                            >
                                                <span className="mode-name" style={{ fontSize: '12px' }}>{name}</span>
                                                <i className="fa-solid fa-play" style={{ fontSize: '10px' }}></i>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="glass-card">
                                    <div className="card-header-flex">
                                        <div>
                                            <h3>Kecepatan &amp; Siklus Gerak</h3>
                                            <p>Sinkronisasi tempo animasi sweep</p>
                                        </div>
                                    </div>
                                    <div className="slider-row-box">
                                        <div className="slider-header-label">
                                            <span>Kecepatan Pola (Speed)</span>
                                            <span className="slider-val-pill">{stopState.speed}%</span>
                                        </div>
                                        <input 
                                            type="range" 
                                            min="10" 
                                            max="100" 
                                            value={stopState.speed} 
                                            onChange={(e) => setStopState({ ...stopState, speed: Number(e.target.value) })}
                                        />
                                    </div>
                                    <button 
                                        className="btn-action-primary" 
                                        style={{ background: 'linear-gradient(135deg, var(--neon-red), #991b1b)', color: '#fff' }}
                                        onClick={() => onNotify("10 Mode Running StopLamp Aktif!", "fa-play")}
                                    >
                                        <i className="fa-solid fa-play"></i> TERAPKAN 10 MODE STOPLAMP
                                    </button>
                                </div>
                            </div>
                        )}

                        {stopState.mode === 'brake' && (
                            <div className="controls-two-col">
                                <div className="glass-card">
                                    <div className="card-header-flex">
                                        <div>
                                            <h3>Pola Respon Pengereman</h3>
                                            <p>Respon instan ketika saklar rem motor aktif</p>
                                        </div>
                                    </div>
                                    <div className="mode-cards-grid">
                                        <div className="mode-pill-card active" onClick={() => onNotify("Pola Rem: Kedip F1 Strobe", "fa-bolt")}>
                                            <span className="mode-name">1. Kedip F1 Strobe (5x Flash)</span>
                                            <i className="fa-solid fa-check"></i>
                                        </div>
                                        <div className="mode-pill-card" onClick={() => onNotify("Pola Rem: Flow Alert", "fa-wind")}>
                                            <span className="mode-name">2. Running Terang (Flow Alert)</span>
                                            <i className="fa-solid fa-wind"></i>
                                        </div>
                                        <div className="mode-pill-card" onClick={() => onNotify("Pola Rem: Steady High Red 100%", "fa-shield")}>
                                            <span className="mode-name">3. Steady High Red (Standar)</span>
                                            <i className="fa-solid fa-shield"></i>
                                        </div>
                                    </div>
                                </div>

                                <div className="glass-card">
                                    <div className="card-header-flex">
                                        <div>
                                            <h3>Standar Keselamatan F1 Flasher</h3>
                                            <p>Simulasi pengereman keselamatan pengendara</p>
                                        </div>
                                    </div>
                                    <div style={{ padding: '14px', background: 'rgba(255, 51, 75, 0.08)', border: '1px solid rgba(255, 51, 75, 0.25)', borderRadius: 'var(--radius-md)', marginBottom: '18px' }}>
                                        <div style={{ fontWeight: '700', color: 'var(--neon-red)', fontSize: '13px', marginBottom: '4px' }}>
                                            <i className="fa-solid fa-triangle-exclamation"></i> Standar F1 Safety Flasher
                                        </div>
                                        <p style={{ fontSize: '11px', color: 'var(--text-secondary)', lineHeight: '1.5' }}>
                                            Saat tuas rem ditarik, lampu akan berkedip stroboskopik 5 kali dalam 0.5 detik sebelum menyala statis 100% untuk memicu reaksi pengemudi di belakang.
                                        </p>
                                    </div>
                                    <button 
                                        className="btn-action-primary" 
                                        style={{ background: 'linear-gradient(135deg, var(--neon-red), #b91c1c)', color: '#fff' }}
                                        onClick={triggerBrakeTest}
                                    >
                                        <i className="fa-solid fa-hand"></i> TEST SIMULASI REM SEKARANG
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </DashboardLayout>
            );
        }

        // ======================== SCREEN: VIP PRO MEMBERSHIP ========================
        function PremiumScreen({ user, setUser, onNotify }) {
            const navigate = useNavigate();

            const activateVip = () => {
                setUser({ ...user, isPremium: true });
                onNotify("Akun berhasil di-upgrade ke VIP PRO!", "fa-crown");
                navigate('/alis');
            };

            return (
                <DashboardLayout
                    user={user}
                    pageTitle="VIP Pro Membership"
                    pageDesc="Akses tak terbatas ke 10 Mode Alis Belang, Dual-Channel sync, dan Cloud OTA"
                    onNotify={onNotify}
                >
                    <div className="view-content-canvas">
                        <div className="glass-card" style={{ textAlign: 'center', maxWidth: '820px', margin: '0 auto' }}>
                            <i className="fa-solid fa-crown" style={{ fontSize: '48px', color: 'var(--neon-purple)', marginBottom: '12px', display: 'inline-block' }}></i>
                            <h2 style={{ fontSize: '24px', fontWeight: '800' }}>Upgrade Akun VIP Pro Exclusive</h2>
                            <p style={{ fontSize: '13px', color: 'var(--text-secondary)', margin: '8px auto 20px', maxWidth: '560px' }}>
                                Dapatkan akses tak terbatas ke 10 fitur Alis Belang futuristik, kustomisasi dual-channel terpisah, cloud backup Google Sheets, dan prioritas firmware ESP32.
                            </p>

                            <div className="vip-grid">
                                <div className="vip-card">
                                    <i className="fa-solid fa-water"></i>
                                    <h4>10 Mode Belang Asimetris</h4>
                                    <p>Animasi gradasi tetesan air kanan &amp; kiri terpisah.</p>
                                </div>
                                <div className="vip-card">
                                    <i className="fa-solid fa-bolt"></i>
                                    <h4>10 Mode Running StopLamp</h4>
                                    <p>Ritme detak jantung &amp; F1 Flasher dinamis.</p>
                                </div>
                                <div className="vip-card">
                                    <i className="fa-solid fa-cloud"></i>
                                    <h4>Cloud Profile Backup</h4>
                                    <p>Simpan konfigurasi ke Google Sheet &amp; ESP32.</p>
                                </div>
                                <div className="vip-card">
                                    <i className="fa-solid fa-wrench"></i>
                                    <h4>Firmware OTA Nirkabel</h4>
                                    <p>Update firmware ESP32 otomatis tanpa kabel.</p>
                                </div>
                            </div>

                            <div className="payment-methods-grid">
                                <div className="pay-option-card" onClick={() => onNotify("Scan QRIS untuk nomor seri #ESP32-8871", "fa-qrcode")}>
                                    <i className="fa-solid fa-qrcode"></i>
                                    <h4>QRIS Instan</h4>
                                    <p>Gopay / Dana / OVO</p>
                                </div>
                                <div className="pay-option-card" onClick={() => onNotify("Transfer Bank BCA: 8871-0092-11 a/n SmartMoto", "fa-building-columns")}>
                                    <i className="fa-solid fa-building-columns"></i>
                                    <h4>Bank Transfer</h4>
                                    <p>BCA / Mandiri / BRI</p>
                                </div>
                                <div className="pay-option-card" onClick={() => onNotify("Menghubungi Admin WhatsApp...", "fa-brands fa-whatsapp")}>
                                    <i className="fa-brands fa-whatsapp"></i>
                                    <h4>Admin WhatsApp</h4>
                                    <p>Verifikasi Cepat 1 Menit</p>
                                </div>
                            </div>

                            <div style={{ display: 'flex', gap: '12px', justifyContent: 'center', flexWrap: 'wrap' }}>
                                <button 
                                    className="btn-action-primary" 
                                    style={{ maxWidth: '280px', background: 'linear-gradient(135deg, var(--neon-purple), var(--neon-pink))', color: '#fff' }}
                                    onClick={activateVip}
                                >
                                    <i className="fa-solid fa-crown"></i> AKTIFKAN VIP SEKARANG (DEMO)
                                </button>
                                <button 
                                    className="pill-tab" 
                                    style={{ padding: '12px 20px' }}
                                    onClick={() => navigate('/home')}
                                >
                                    Kembali ke Overview
                                </button>
                            </div>
                        </div>
                    </div>
                </DashboardLayout>
            );
        }

        // ======================== ROOT APP CONTAINER ========================
        function App() {
            const [user, setUser] = useState({
                name: 'Rider_Speedster',
                id: 'ESP32-8871',
                isPremium: true
            });

            const [alisState, setAlisState] = useState({
                color: '#00f0ff',
                brightness: 85,
                speed: 65,
                mode: 'static', // 'static' | 'running' | 'belang'
                runningPattern: 'anim-rainbow-active',
                belangPattern: 'belang-water'
            });

            const [relays, setRelays] = useState({
                biled: true,
                fog: true
            });

            const [stopState, setStopState] = useState({
                color: '#ff334b',
                brightness: 80,
                speed: 60,
                mode: 'static' // 'static' | 'running' | 'brake'
            });

            const [toast, setToast] = useState({ msg: '', icon: '' });

            const triggerNotify = (msg, icon = 'fa-bolt-lightning') => {
                setToast({ msg, icon });
            };

            const triggerPassBeamFlash = () => {
                const original = relays.biled;
                let toggleCount = 0;
                const interval = setInterval(() => {
                    setRelays(prev => ({ ...prev, biled: !prev.biled }));
                    toggleCount++;
                    if (toggleCount > 5) {
                        clearInterval(interval);
                        setRelays(prev => ({ ...prev, biled: original }));
                    }
                }, 120);
            };

            const location = useLocation();

            return (
                <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
                    <TopNavSwitcher currentPath={location.pathname} />

                    <Routes>
                        <Route 
                            path="/" 
                            element={<LoginScreen user={user} setUser={setUser} onNotify={triggerNotify} />} 
                        />
                        <Route 
                            path="/home" 
                            element={
                                <HomeScreen 
                                    user={user} 
                                    alisState={alisState} 
                                    setAlisState={setAlisState} 
                                    relays={relays} 
                                    setRelays={setRelays} 
                                    onNotify={triggerNotify}
                                    triggerFlash={triggerPassBeamFlash}
                                />
                            } 
                        />
                        <Route 
                            path="/alis" 
                            element={
                                <AlisScreen 
                                    user={user} 
                                    alisState={alisState} 
                                    setAlisState={setAlisState} 
                                    relays={relays} 
                                    setRelays={setRelays} 
                                    onNotify={triggerNotify}
                                    triggerFlash={triggerPassBeamFlash}
                                />
                            } 
                        />
                        <Route 
                            path="/lamp" 
                            element={
                                <LampRelayScreen 
                                    user={user} 
                                    relays={relays} 
                                    setRelays={setRelays} 
                                    onNotify={triggerNotify}
                                    triggerFlash={triggerPassBeamFlash}
                                />
                            } 
                        />
                        <Route 
                            path="/stoplamp" 
                            element={
                                <StoplampScreen 
                                    user={user} 
                                    stopState={stopState} 
                                    setStopState={setStopState} 
                                    onNotify={triggerNotify} 
                                />
                            } 
                        />
                        <Route 
                            path="/premium" 
                            element={
                                <PremiumScreen 
                                    user={user} 
                                    setUser={setUser} 
                                    onNotify={triggerNotify} 
                                />
                            } 
                        />
                    </Routes>

                    <Toast 
                        message={toast.msg} 
                        icon={toast.icon} 
                        onClose={() => setToast({ msg: '', icon: '' })} 
                    />
                </div>
            );
        }

        // Render Application with MemoryRouter
        const rootElement = document.getElementById('root');
        const root = createRoot(rootElement);
        root.render(
            <MemoryRouter initialEntries={["/home"]}>
                <App />
            </MemoryRouter>
        );
    </script>
</body>
</html>

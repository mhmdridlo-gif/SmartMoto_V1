<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Smart Moto OS - Next-Gen IoT LED Controller</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & React Router Global Scripts -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/history@5/umd/history.development.js"></script>
    <script src="https://unpkg.com/react-router@6.3.0/umd/react-router.development.js"></script>
    <script src="https://unpkg.com/react-router-dom@6.3.0/umd/react-router-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <style>
        :root {
            --bg-base: #0a0d14;
            --bg-surface: #111622;
            --bg-card: rgba(20, 27, 41, 0.85);
            --bg-card-hover: rgba(30, 39, 58, 0.9);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(0, 240, 255, 0.25);
            
            --primary: #ec5b13;
            --neon-cyan: #00f0ff;
            --neon-purple: #a855f7;
            --neon-pink: #ec4899;
            --neon-amber: #f59e0b;
            --neon-red: #ff334b;
            --neon-emerald: #10b981;
            
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 18px;
            --radius-xl: 24px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 12% 18%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 88% 82%, rgba(168, 85, 247, 0.08) 0%, transparent 45%);
            background-attachment: fixed;
        }

        .ambient-glow {
            position: fixed;
            width: 380px;
            height: 380px;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(110px);
            opacity: 0.16;
            z-index: 0;
            transition: all 0.8s ease;
        }
        #glow1 { top: -80px; left: -80px; background: var(--neon-cyan); }
        #glow2 { bottom: -80px; right: -80px; background: var(--neon-purple); }

        .toast-container {
            position: fixed;
            top: 65px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }
        .toast-bubble {
            background: rgba(17, 22, 34, 0.95);
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 8px 30px rgba(0, 240, 255, 0.25);
            padding: 12px 18px;
            border-radius: var(--radius-md);
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(14px);
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideIn {
            from { transform: translateY(-30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .top-nav-switcher {
            position: sticky;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(10, 13, 20, 0.92);
            border-bottom: 1px solid var(--border-glass);
            backdrop-filter: blur(20px);
            padding: 10px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        .switcher-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: var(--neon-cyan);
            text-decoration: none;
        }
        .pulse-dot {
            width: 9px;
            height: 9px;
            background: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-cyan);
            animation: pulse 1.6s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.4; }
        }

        .switcher-pills {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .switcher-pills::-webkit-scrollbar { display: none; }
        .pill-tab {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
        }
        .pill-tab:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        .pill-tab.active {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.3), rgba(168, 85, 247, 0.3));
            border-color: var(--neon-cyan);
            color: #fff;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.3);
        }
        .pill-tab.pill-vip.active {
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-pink));
            border-color: transparent;
            color: #fff;
        }

        /* LOGIN SCREEN */
        .login-view-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            flex: 1;
            min-height: calc(100vh - 58px);
            position: relative;
            z-index: 1;
        }
        .login-card {
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-xl);
            padding: 36px 30px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 35px rgba(0, 240, 255, 0.12);
            backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink));
        }
        .brand-badge {
            width: 68px;
            height: 68px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, rgba(0,240,255,0.15), rgba(168,85,247,0.15));
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.25);
            font-size: 32px;
            color: var(--neon-cyan);
            transform: rotate(-5deg);
        }
        .brand-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }
        .brand-title span {
            background: linear-gradient(90deg, var(--neon-cyan), #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .brand-subtitle {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }
        .ble-status-box {
            background: rgba(10, 13, 20, 0.6);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            padding: 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .input-wrapper {
            position: relative;
        }
        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }
        .input-field {
            width: 100%;
            padding: 13px 14px 13px 40px;
            background: rgba(10, 13, 20, 0.8);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 13px;
            font-family: inherit;
            outline: none;
            transition: all 0.25s ease;
        }
        .input-field:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 16px rgba(0, 240, 255, 0.25);
        }
        .btn-action-primary {
            width: 100%;
            padding: 13px;
            border-radius: var(--radius-md);
            border: none;
            background: linear-gradient(135deg, var(--neon-cyan), #0284c7);
            color: #05101a;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 240, 255, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.25s;
            font-family: inherit;
        }
        .btn-action-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }
        .btn-ble-connect {
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid var(--neon-cyan);
            background: rgba(0, 240, 255, 0.1);
            color: var(--neon-cyan);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.25s;
        }
        .btn-ble-connect.connected {
            border-color: var(--neon-emerald);
            background: rgba(16, 185, 129, 0.1);
            color: var(--neon-emerald);
        }

        /* DASHBOARD SHELL & OTHER STYLES */
        .dashboard-container { display: flex; width: 100%; flex: 1; position: relative; z-index: 1; }
        .sidebar { width: 250px; background: rgba(14, 18, 28, 0.95); border-right: 1px solid var(--border-glass); backdrop-filter: blur(20px); padding: 22px 14px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; position: sticky; top: 55px; height: calc(100vh - 55px); }
        .sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 18px; border-bottom: 1px solid var(--border-glass); margin-bottom: 10px; }
        .brand-icon-sm { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple)); color: #000; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; }
        .brand-text-sm h2 { font-size: 15px; font-weight: 700; }
        .brand-text-sm h2 span { color: var(--neon-cyan); }
        .brand-text-sm p { font-size: 10px; color: var(--text-secondary); text-transform: uppercase; }
        .side-nav-btn { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--radius-md); color: var(--text-secondary); font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; text-decoration: none; }
        .side-nav-btn i { width: 20px; text-align: center; font-size: 16px; }
        .side-nav-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.04); }
        .side-nav-btn.active { color: #05101a; background: linear-gradient(90deg, var(--neon-cyan), #38bdf8); box-shadow: 0 4px 18px rgba(0, 240, 255, 0.3); }
        .side-nav-btn.active i { color: #05101a; }
        .side-nav-btn.side-vip { border: 1px solid rgba(168, 85, 247, 0.3); color: #d8b4fe; background: rgba(168, 85, 247, 0.08); }
        .side-nav-btn.side-vip.active { background: linear-gradient(90deg, var(--neon-purple), var(--neon-pink)); color: #fff; }
        .side-nav-btn.side-logout { margin-top: auto; color: #f87171; border: 1px solid rgba(248, 113, 113, 0.2); background: rgba(248, 113, 113, 0.05); }

        .workspace { flex: 1; display: flex; flex-direction: column; min-height: calc(100vh - 55px); overflow-y: auto; }
        .top-navbar { height: 64px; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-glass); background: rgba(10, 13, 20, 0.7); backdrop-filter: blur(16px); position: sticky; top: 0; z-index: 40; }
        .page-meta h1 { font-size: 18px; font-weight: 700; }
        .page-meta p { font-size: 11px; color: var(--text-secondary); }
        .header-actions { display: flex; align-items: center; gap: 12px; }
        .telemetry-chip { display: flex; align-items: center; gap: 8px; padding: 5px 12px; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border-glass); border-radius: 20px; font-size: 11px; color: var(--text-secondary); }
        .telemetry-chip b { color: var(--neon-cyan); }
        .profile-pill { display: flex; align-items: center; gap: 10px; padding: 4px 12px 4px 4px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-glass); border-radius: 30px; cursor: pointer; text-decoration: none; color: inherit; }
        .avatar-circle { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple)); color: #000; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
        .view-content-canvas { padding: 24px 28px 80px; max-width: 1240px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        .glass-card { background: var(--bg-card); border: 1px solid var(--border-glass); border-radius: var(--radius-lg); padding: 22px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35); backdrop-filter: blur(14px); }
        .card-header-flex { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .card-title-group { display: flex; align-items: center; gap: 10px; }
        .card-icon-tag { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 15px; background: rgba(0, 240, 255, 0.1); color: var(--neon-cyan); border: 1px solid rgba(0, 240, 255, 0.2); }
        .card-title-group h3 { font-size: 15px; font-weight: 700; }
        .card-title-group p { font-size: 11px; color: var(--text-secondary); }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
        .stat-item { background: var(--bg-card); border: 1px solid var(--border-glass); border-radius: var(--radius-md); padding: 16px; display: flex; align-items: center; gap: 14px; }
        .stat-item i { font-size: 22px; }
        .stat-label { font-size: 10px; text-transform: uppercase; color: var(--text-secondary); font-weight: 600; }
        .stat-val { font-size: 18px; font-weight: 800; font-family: 'JetBrains Mono', monospace; margin-top: 2px; }
        .interactive-simulator-box { width: 100%; background: radial-gradient(circle at 50% 50%, #151d2f 0%, #0c101a 100%); border: 1px solid var(--border-glass); border-radius: var(--radius-lg); padding: 24px 20px; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 180px; box-shadow: inset 0 0 50px rgba(0,0,0,0.6); }
        .motorcycle-headlight-visual { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 16px; align-items: center; }
        .alis-eyebrow-container { display: flex; justify-content: space-between; width: 100%; gap: 20px; }
        .alis-wing { flex: 1; height: 16px; border-radius: 20px; transition: all 0.3s ease; position: relative; }
        .alis-wing.left-wing { transform: perspective(300px) rotateY(15deg) skewY(-3deg); }
        .alis-wing.right-wing { transform: perspective(300px) rotateY(-15deg) skewY(3deg); }
        .projector-cluster { display: flex; align-items: center; justify-content: center; gap: 24px; }
        .biled-lens { width: 68px; height: 68px; border-radius: 50%; background: radial-gradient(circle, #ffffff 20%, #00f0ff 60%, rgba(2, 132, 199, 0.6) 90%); box-shadow: 0 0 35px #00f0ff, 0 0 70px rgba(0, 240, 255, 0.6); border: 3px solid rgba(255, 255, 255, 0.9); transition: all 0.4s ease; }
        .biled-lens.off { background: #1e293b; box-shadow: none; border-color: #334155; opacity: 0.35; }
        .foglamp-lens { width: 32px; height: 32px; border-radius: 50%; background: radial-gradient(circle, #fff 20%, #f59e0b 80%); box-shadow: 0 0 20px #f59e0b; border: 2px solid #fef3c7; transition: 0.3s; }
        .foglamp-lens.off { background: #1e293b; box-shadow: none; border-color: #334155; opacity: 0.35; }
        .stoplamp-tail-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .tail-led-bar { width: 100%; height: 24px; border-radius: 12px; transition: all 0.3s ease; }
        .segmented-tabs-wrapper { background: rgba(10, 13, 20, 0.85); border: 1px solid var(--border-glass); border-radius: var(--radius-md); padding: 4px; display: flex; gap: 4px; margin-bottom: 20px; }
        .segmented-btn { flex: 1; padding: 10px 14px; border: none; background: transparent; color: var(--text-secondary); font-size: 12px; font-weight: 600; border-radius: 10px; cursor: pointer; transition: all 0.25s ease; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; }
        .segmented-btn.active { background: linear-gradient(135deg, var(--neon-cyan), #0284c7); color: #05101a; box-shadow: 0 4px 14px rgba(0, 240, 255, 0.35); font-weight: 700; }
        .segmented-btn.premium-tab-glow.active { background: linear-gradient(135deg, var(--neon-purple), var(--neon-pink)); color: #fff; box-shadow: 0 4px 18px rgba(168, 85, 247, 0.4); }
        .controls-two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .color-palette-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 10px; margin: 12px 0 16px; }
        .color-swatch-bubble { width: 44px; height: 44px; border-radius: 50%; cursor: pointer; border: 2px solid rgba(255, 255, 255, 0.15); transition: all 0.25s; display: flex; align-items: center; justify-content: center; }
        .color-swatch-bubble:hover, .color-swatch-bubble.selected { transform: scale(1.15); border-color: #fff; box-shadow: 0 0 18px currentColor; }
        .empty-save-slot { background: rgba(255, 255, 255, 0.04); border: 2px dashed rgba(255, 255, 255, 0.25); color: var(--text-muted); font-size: 18px; }
        .slider-row-box { background: rgba(10, 13, 20, 0.6); border: 1px solid var(--border-glass); border-radius: var(--radius-md); padding: 14px 18px; margin-bottom: 12px; }
        .slider-header-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 12px; font-weight: 600; color: var(--text-secondary); }
        .slider-val-pill { font-size: 12px; font-weight: 700; color: var(--neon-cyan); background: rgba(0, 240, 255, 0.1); padding: 2px 8px; border-radius: 10px; }
        input[type=range] { -webkit-appearance: none; width: 100%; height: 6px; border-radius: 3px; background: #1e293b; outline: none; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--neon-cyan); box-shadow: 0 0 12px var(--neon-cyan); cursor: pointer; transition: 0.15s; }
        .mode-cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; max-height: 280px; overflow-y: auto; padding-right: 4px; margin-bottom: 16px; }
        .mode-pill-card { padding: 12px 14px; background: rgba(10, 13, 20, 0.7); border: 1px solid var(--border-glass); border-radius: var(--radius-md); cursor: pointer; transition: all 0.25s ease; display: flex; align-items: center; justify-content: space-between; }
        .mode-pill-card:hover { border-color: rgba(0, 240, 255, 0.4); transform: translateY(-2px); }
        .mode-pill-card.active { background: rgba(0, 240, 255, 0.15); border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0, 240, 255, 0.2); }
        .mode-pill-card.active .mode-name { color: var(--neon-cyan); font-weight: 700; }
        .mode-pill-card.vip.active { background: rgba(168, 85, 247, 0.15); border-color: var(--neon-purple); }
        .mode-pill-card.vip.active .mode-name { color: #d8b4fe; }
        .relay-card-unit { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; background: rgba(10, 13, 20, 0.6); border: 1px solid var(--border-glass); border-radius: var(--radius-lg); margin-bottom: 14px; transition: 0.3s; }
        .relay-identity { display: flex; align-items: center; gap: 14px; }
        .relay-icon-badge { width: 44px; height: 44px; border-radius: 14px; background: rgba(255, 255, 255, 0.05); display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--text-secondary); }
        .relay-card-unit.is-active .relay-icon-badge { background: rgba(0, 240, 255, 0.15); color: var(--neon-cyan); box-shadow: 0 0 20px rgba(0, 240, 255, 0.3); }
        .relay-card-unit.is-fog-active .relay-icon-badge { background: rgba(245, 158, 11, 0.15); color: var(--neon-amber); box-shadow: 0 0 20px rgba(245, 158, 11, 0.3); }
        .toggle-switch-ios { position: relative; display: inline-block; width: 56px; height: 30px; }
        .toggle-switch-ios input { opacity: 0; width: 0; height: 0; }
        .toggle-slider { position: absolute; cursor: pointer; inset: 0; background-color: #1e293b; border: 1px solid var(--border-glass); border-radius: 34px; transition: .35s; }

        @keyframes animStrobePulse { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.1; } }

        .anim-rainbow-active { animation: animRainbow 2s linear infinite !important; }

    </style>
</head>
<body>

    <div class="ambient-glow" id="glow1"></div>
    <div class="ambient-glow" id="glow2"></div>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createRoot } = ReactDOM;
        const { MemoryRouter, Routes, Route, Link, useNavigate, useLocation } = ReactRouterDOM;

        function Toast({ message, icon, onClose }) {
            useEffect(() => {
                if (!message) return;
                const timer = setTimeout(onClose, 2800);
                return () => clearTimeout(timer);
            }, [message]);

            if (!message) return null;

            return (
                <div className="toast-container">
                    <div className="toast-bubble">
                        <i className={`fa-solid ${icon || 'fa-bolt-lightning'}`} style={{ color: 'var(--neon-cyan)' }}></i>
                        <span>{message}</span>
                    </div>
                </div>
            );
        }

        function TopNavSwitcher({ currentPath }) {
            return (
                <header className="top-nav-switcher">
                    <Link to="/" className="switcher-brand">
                        <span className="pulse-dot"></span>
                        <span>SMART MOTO NAVIGATOR</span>
                    </Link>
                    <div className="switcher-pills">
                        <Link to="/" className={`pill-tab ${currentPath === '/' ? 'active' : ''}`}>
                            <i className="fa-solid fa-right-to-bracket"></i> Login
                        </Link>
                        <Link to="/home" className={`pill-tab ${currentPath === '/home' ? 'active' : ''}`}>
                            <i className="fa-solid fa-gauge-high"></i> Home
                        </Link>
                        <Link to="/alis" className={`pill-tab ${currentPath === '/alis' ? 'active' : ''}`}>
                            <i className="fa-solid fa-bezier-curve"></i> Alis DRL
                        </Link>
                        <Link to="/lamp" className={`pill-tab ${currentPath === '/lamp' ? 'active' : ''}`}>
                            <i className="fa-solid fa-lightbulb"></i> Lamp Relay
                        </Link>
                        <Link to="/stoplamp" className={`pill-tab ${currentPath === '/stoplamp' ? 'active' : ''}`}>
                            <i className="fa-solid fa-circle-exclamation"></i> StopLamp
                        </Link>
                        <Link to="/premium" className={`pill-tab pill-vip ${currentPath === '/premium' ? 'active' : ''}`}>
                            <i className="fa-solid fa-crown"></i> VIP Pro
                        </Link>
                    </div>
                </header>
            );
        }

        function CockpitSimulator({ alisState, relays, stopState, onTestFlash }) {
            const isBelang = alisState.mode === 'belang';
            const isRunning = alisState.mode === 'running';

            const getLeftWingStyle = () => {
                if (isBelang) {
                    return {
                        background: 'linear-gradient(90deg, #00f0ff, #3b82f6, #1e1b4b)',
                        boxShadow: '0 0 25px #00f0ff, 0 0 45px rgba(0, 240, 255, 0.5)',
                        opacity: alisState.brightness / 100
                    };
                }
                if (isRunning) {
                    return {
                        background: 'linear-gradient(90deg, #ff0055, #00f0ff, #a855f7)',
                        boxShadow: '0 0 25px #00f0ff',
                        opacity: alisState.brightness / 100
                    };
                }
                return {
                    background: alisState.color,
                    boxShadow: `0 0 25px ${alisState.color}, 0 0 50px ${alisState.color}88`,
                    opacity: alisState.brightness / 100
                };
            };

            const getRightWingStyle = () => {
                if (isBelang) {
                    return {
                        background: 'linear-gradient(90deg, #1e1b4b, #a855f7, #ec4899)',
                        boxShadow: '0 0 25px #ec4899, 0 0 45px rgba(236, 72, 153, 0.5)',
                        opacity: alisState.brightness / 100
                    };
                }
                if (isRunning) {
                    return {
                        background: 'linear-gradient(90deg, #a855f7, #00f0ff, #ff0055)',
                        boxShadow: '0 0 25px #a855f7',
                        opacity: alisState.brightness / 100
                    };
                }
                return {
                    background: alisState.color,
                    boxShadow: `0 0 25px ${alisState.color}, 0 0 50px ${alisState.color}88`,

                            <div>
                                <h3>Simulasi Lampu Motor (Live Synced)</h3>
                                <p>Visualisasi interaktif dual LED Strip WS2812B &amp; relay BiLED real-time</p>
                            </div>
                        </div>
                        <button className="pill-tab" onClick={onTestFlash}>
                            <i className="fa-solid fa-bell"></i> Tes Pass Beam Flash

                    <div className="interactive-simulator-box">
                        <div className="motorcycle-headlight-visual">

                                <div className={`alis-wing left-wing ${animClass}`} style={getLeftWingStyle()}></div>
                                <div className={`alis-wing right-wing ${animClass}`} style={getRightWingStyle()}></div>
                            </div>
                            <div className="projector-cluster">
                                <div className={`foglamp-lens ${relays.fog ? '' : 'off'}`}></div>
                                <div className={`biled-lens ${relays.biled ? '' : 'off'}`}></div>
                                <div className={`foglamp-lens ${relays.fog ? '' : 'off'}`}></div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function DashboardLayout({ children, user, pageTitle, pageDesc, onNotify }) {

            return (

                            </div>

                                <h2>Smart<span>Moto</span></h2>

                        </div>

                        <Link to="/home" className={`side-nav-btn ${location.pathname === '/home' ? 'active' : ''}`}>

                        <Link to="/premium" className={`side-nav-btn side-vip ${location.pathname === '/premium' ? 'active' : ''}`}>

                            <span>Upgrade VIP Pro</span>

                    <main className="workspace">

                                <p>{pageDesc}</p>
                            </div>
                            <div className="header-actions">
                                <div className="telemetry-chip">
                                    <i className="fa-solid fa-car-battery" style={{ color: '#10b981' }}></i>
                                    <span>Aki: <b>12.6V</b></span>
                                </div>
                                <div className="telemetry-chip">

                                    <span>ESP32: <b>Online</b></span>

                                <Link to="/premium" className="profile-pill">
                                    <div className="avatar-circle">{user.name.substring(0, 2).toUpperCase()}</div>
                                    <div>
                                        <div style={{ fontSize: '12px', fontWeight: '700' }}>{user.name}</div>
                                        <div style={{ fontSize: '9px', color: user.isPremium ? 'var(--neon-purple)' : 'var(--text-muted)' }}>
                                            {user.isPremium ? '👑 VIP PRO' : 'FREE MEMBER'}
                                        </div>
                                    </div>
                                </Link>
                            </div>
                        </header>

                        {children}
                    </main>

                    <nav className="mobile-dock-nav">
                        <Link to="/home" className={`dock-tab ${location.pathname === '/home' ? 'active' : ''}`}>
                            <i className="fa-solid fa-gauge-high"></i>
                            <span>Home</span>
                        </Link>
                        <Link to="/alis" className={`dock-tab ${location.pathname === '/alis' ? 'active' : ''}`}>
                            <i className="fa-solid fa-bezier-curve"></i>
                            <span>Alis</span>
                        </Link>
                        <Link to="/lamp" className={`dock-tab ${location.pathname === '/lamp' ? 'active' : ''}`}>
                            <i className="fa-solid fa-lightbulb"></i>
                            <span>Relay</span>
                        </Link>
                        <Link to="/stoplamp" className={`dock-tab ${location.pathname === '/stoplamp' ? 'active' : ''}`}>
                            <i className="fa-solid fa-circle-exclamation"></i>
                            <span>StopLamp</span>
                        </Link>
                        <Link to="/premium" className={`dock-tab ${location.pathname === '/premium' ? 'active' : ''}`}>
                            <i className="fa-solid fa-crown" style={{ color: 'var(--neon-purple)' }}></i>
                            <span>VIP</span>
                        </Link>
                    </nav>
                </div>
            );
        }

        // ======================== SCREEN 1: LOGIN PAGE (BLUETOOTH + DB AUTH) ========================
        function LoginScreen({ user, setUser, onNotify }) {
            const navigate = useNavigate();
            const [username, setUsername] = useState(user.name);
            const [password, setPassword] = useState('');
            const [isBleConnected, setIsBleConnected] = useState(false);
            const [deviceName, setDeviceName] = useState('');
            const [isConnecting, setIsConnecting] = useState(false);

            // Simulasi database password yang tersimpan di ESP32 / Server DB
            const databasePasswords = {
                "admin": "admin123",
                "rider_speedster": "moto2026",
                "operator": "esp32secure"
            };

            const handleConnectBluetooth = async () => {
                setIsConnecting(true);
                try {
                    if (!navigator.bluetooth) {
                        alert("Web Bluetooth API tidak didukung pada browser ini. Harap gunakan Google Chrome atau Microsoft Edge.");
                        setIsConnecting(false);
                        return;
                    }

                    // Memindai dan meminta koneksi perangkat BLE ESP32
                    const device = await navigator.bluetooth.requestDevice({
                        acceptAllDevices: true,
                        optionalServices: ['4fafc201-1fb5-459e-8fcc-c5c9c331914b'] // Contoh UUID Service ESP32 BLE
                    });

                    setDeviceName(device.name || "SmartMoto_ESP32");
                    setIsBleConnected(true);
                    onNotify(`Berhasil terhubung ke perangkat: ${device.name || "SmartMoto_ESP32"}`, 'fa-bluetooth');
                } catch (error) {
                    console.log('Bluetooth connection error or cancelled:', error);
                    // Fallback simulasi jika testing di browser tanpa hardware fisik di dekatnya
                    setIsBleConnected(true);
                    setDeviceName("SmartMoto_ESP32 (Simulasi Terhubung)");
                    onNotify("Terhubung ke perangkat ESP32 via Bluetooth", 'fa-bluetooth');
                } finally {
                    setIsConnecting(false);
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();

                // Validasi 1: Wajib terhubung ke Bluetooth ESP32 terlebih dahulu
                if (!isBleConnected) {
                    onNotify("Perangkat belum terhubung via Bluetooth!", "fa-triangle-exclamation");
                    return;
                }

                // Validasi 2: Cek kecocokan password dengan database
                const cleanUser = username.trim().toLowerCase();
                const validPassword = databasePasswords[cleanUser] || "admin123"; // Default fallback jika username baru

                if (password !== validPassword) {
                    onNotify("Password salah! Silakan cek kembali database ESP32.", "fa-triangle-exclamation");
                    return;
                }

                setUser({ ...user, name: username });
                onNotify(`Login Berhasil! Selamat datang, ${username}`, 'fa-shield-halved');
                navigate('/home');
            };

            return (
                <div className="login-view-wrap">
                    <div className="login-card">
                        <div className="brand-badge">
                            <i className="fa-solid fa-bolt"></i>
                        </div>
                        <h1 className="brand-title">Smart<span>Moto</span> OS</h1>
                        <p className="brand-subtitle">ESP32 Bluetooth Secure Authentication</p>
                        
                        {/* Status & Tombol Koneksi Bluetooth */}
                        <div className="ble-status-box">
                            <div style={{ textAlign: 'left' }}>
                                <div style={{ fontSize: '11px', color: 'var(--text-secondary)', fontWeight: '700' }}>STATUS BLUETOOTH</div>
                                <div style={{ fontSize: '12px', color: isBleConnected ? 'var(--neon-emerald)' : 'var(--neon-amber)', fontWeight: '600' }}>
                                    {isBleConnected ? `Connected: ${deviceName}` : 'Belum Terhubung'}
                                </div>
                            </div>
                            <button 
                                type="button" 
                                className={`btn-ble-connect ${isBleConnected ? 'connected' : ''}`}
                                onClick={handleConnectBluetooth}
                                disabled={isConnecting}
                            >
                                <i className="fa-brands fa-bluetooth-b"></i>
                                {isConnecting ? 'Scanning...' : isBleConnected ? 'Connected' : 'Hubungkan'}
                            </button>
                        </div>

                        <form onSubmit={handleSubmit}>
                            <div className="input-group">
                                <label>Username Operator</label>
                                <div className="input-wrapper">
                                    <i className="fa-solid fa-user"></i>
                                    <input 
                                        type="text" 
                                        className="input-field" 
                                        value={username} 
                                        onChange={(e) => setUsername(e.target.value)}
                                        required 
                                    />
                                </div>
                            </div>
                            <div className="input-group">
                                <label>Password Database ESP32</label>
                                <div className="input-wrapper">
                                    <i className="fa-solid fa-lock"></i>
                                    <input 
                                        type="password" 
                                        className="input-field" 
                                        placeholder="Masukkan password database..."
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)} 
                                        required 
                                    />
                                </div>
                            </div>
                            <button 
                                type="submit" 
                                className="btn-action-primary"
                                disabled={!isBleConnected}
                            >
                                <i className="fa-solid fa-shield-halved"></i> OTENTIKASI &amp; MASUK
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // ======================== SCREEN 2: HOME OVERVIEW ========================
        function HomeScreen({ user, alisState, setAlisState, relays, setRelays, onNotify, triggerFlash }) {

                                <i className="fa-solid fa-bluetooth" style={{ color: 'var(--neon-cyan)' }}></i>
                                <div>
                                    <div className="stat-label">Koneksi BLE</div>
                                    <div className="stat-val" style={{ fontSize: '14px', color: 'var(--neon-cyan)' }}>Secure Active</div>
                                </div>
                            </div>
                            <div className="stat-item">
                                <i className="fa-solid fa-car-battery" style={{ color: 'var(--neon-emerald)' }}></i>
                                <div>
                                    <div className="stat-label">Voltase Aki</div>
                                    <div className="stat-val" style={{ color: 'var(--neon-emerald)' }}>12.6 V</div>
                                </div>
                            </div>
                            <div className="stat-item">
                                <i className="fa-solid fa-temperature-half" style={{ color: 'var(--neon-amber)' }}></i>
                                <div>
                                    <div className="stat-label">Suhu Modul</div>
                                    <div className="stat-val" style={{ color: 'var(--neon-amber)' }}>34.2 °C</div>
                                </div>
                            </div>
                            <div className="stat-item">
                                <i className="fa-solid fa-clock" style={{ color: 'var(--neon-purple)' }}></i>
                                <div>
                                    <div className="stat-label">Jam Operasional</div>
                                    <div className="stat-val">{timeStr}</div>
                                </div>
                            </div>
                        </div>

                        <CockpitSimulator

                                onNotify("Pass Beam Flash 3x Diaktifkan!", "fa-high-definition");
                            }} 
                        />
                    </div>
                </DashboardLayout>
            );
        }

        // ======================== SCREEN 3: ALIS CONTROLLER ========================
        function AlisScreen({ user, alisState, setAlisState, relays, setRelays, onNotify, triggerFlash }) {
            const [savedColors, setSavedColors] = useState(['#00f0ff', '#3b82f6', '#ec4899', '#f59e0b', '#10b981']);

            const runningPatterns = [
                { id: 'anim-rainbow-active', name: '1. Pelangi Berjalan (Rainbow Sweep)', icon: 'fa-wand-magic-sparkles' },
                { id: 'anim-strobe-active', name: '2. Strobe Cepat (Flash Strobe)', icon: 'fa-bolt' },
                { id: 'anim-breath-active', name: '3. Color Fade Halus (Breathing Glow)', icon: 'fa-eye' },
            ];

            return (
                <DashboardLayout
                    user={user}
                    pageTitle="Alis (DRL) Controller"
                    pageDesc="Pengaturan warna static, animasi running, dan mode belang dual-channel"
                    onNotify={onNotify}
                >
                    <div className="view-content-canvas">
                        <div className="segmented-tabs-wrapper">
                            <button 
                                className={`segmented-btn ${alisState.mode === 'static' ? 'active' : ''}`}
                                onClick={() => setAlisState({ ...alisState, mode: 'static' })}
                            >
                                <i className="fa-solid fa-palette"></i> Static Mode
                            </button>
                            <button 
                                className={`segmented-btn ${alisState.mode === 'running' ? 'active' : ''}`}
                                onClick={() => setAlisState({ ...alisState, mode: 'running' })}
                            >
                                <i className="fa-solid fa-wind"></i> Running Mode
                            </button>
                        </div>

                        <CockpitSimulator 
                            alisState={alisState} 
                            relays={relays} 
                            onTestFlash={triggerFlash}
                        />

                        <div className="glass-card">
                            <h3>Palet Warna Alis</h3>
                            <div className="color-palette-grid">
                                {['#00f0ff', '#3b82f6', '#a855f7', '#ec4899', '#ff334b', '#f59e0b', '#10b981', '#ffffff'].map(c => (
                                    <div 
                                        key={c}
                                        className={`color-swatch-bubble ${alisState.color === c ? 'selected' : ''}`}
                                        style={{ background: c, color: c }}
                                        onClick={() => setAlisState({ ...alisState, color: c })}
                                    />
                                ))}
                            </div>
                        </div>
                    </div>
                </DashboardLayout>
            );
        }

        // ======================== SCREEN 4: LAMP RELAY ========================
        function LampRelayScreen({ user, relays, setRelays, onNotify, triggerFlash }) {
            return (
                <DashboardLayout
                    user={user}
                    pageTitle="Headlight Relay Controls"
                    pageDesc="Kontrol langsung arus saklar relay 12V BiLED Projector &amp; Laser Foglamp"
                    onNotify={onNotify}
                >
                    <div className="view-content-canvas">
                        <div className="glass-card">
                            <div className={`relay-card-unit ${relays.biled ? 'is-active' : ''}`}>
                                <div className="relay-identity">
                                    <div className="relay-icon-badge"><i className="fa-solid fa-sun"></i></div>
                                    <div>
                                        <h4>BiLED Main Projector (55W)</h4>
                                        <p style={{ fontSize: '12px', color: 'var(--text-secondary)' }}>Blue Lens Cut-Off</p>
                                    </div>
                                </div>
                                <label className="toggle-switch-ios">
                                    <input 
                                        type="checkbox" 
                                        checked={relays.biled} 
                                        onChange={(e) => setRelays({ ...relays, biled: e.target.checked })} 
                                    />
                                    <span className="toggle-slider"></span>
                                </label>
                            </div>
                        </div>
                    </div>
                </DashboardLayout>
            );
        }

        // ======================== SCREEN 5: STOPLAMP ========================
        function StoplampScreen({ user, stopState, setStopState, onNotify }) {
            return (
                <DashboardLayout
                    user={user}
                    pageTitle="StopLamp Tail Controller"
                    pageDesc="Kustomisasi lampu kota belakang &amp; respon rem"
                    onNotify={onNotify}
                >
                    <div className="view-content-canvas">
                        <div className="glass-card">
                            <h3>Pengaturan StopLamp Aktif</h3>
                            <p style={{ color: 'var(--text-secondary)', fontSize: '13px', marginTop: '6px' }}>Gunakan panel ini untuk mengatur mode standby stoplamp belakang.</p>
                        </div>
                    </div>
                </DashboardLayout>
            );
        }

        // ======================== SCREEN 6: PREMIUM ========================
        function PremiumScreen({ user, setUser, onNotify }) {
            const navigate = useNavigate();
            return (
                <DashboardLayout
                    user={user}
                    pageTitle="VIP Pro Membership"
                    pageDesc="Akses tak terbatas ke 10 Mode Alis Belang &amp; Cloud Sync"
                    onNotify={onNotify}
                >
                    <div className="view-content-canvas">
                        <div className="glass-card" style={{ textAlign: 'center', maxWidth: '820px', margin: '0 auto' }}>
                            <i className="fa-solid fa-crown" style={{ fontSize: '48px', color: 'var(--neon-purple)', marginBottom: '12px', display: 'inline-block' }}></i>
                            <h2>Upgrade Akun VIP Pro Exclusive</h2>
                            <button 
                                className="btn-action-primary" 
                                style={{ maxWidth: '280px', margin: '20px auto 0', background: 'linear-gradient(135deg, var(--neon-purple), var(--neon-pink))', color: '#fff' }}
                                onClick={() => {
                                    setUser({ ...user, isPremium: true });
                                    onNotify("VIP Pro diaktifkan!", "fa-crown");
                                    navigate('/alis');
                                }}
                            >
                                <i className="fa-solid fa-crown"></i> AKTIFKAN VIP SEKARANG
                            </button>
                        </div>
                    </div>
                </DashboardLayout>
            );
        }

        function App() {
            const [user, setUser] = useState({
                name: 'Rider_Speedster',
                id: 'ESP32-8871',
                isPremium: true
            });

            const [alisState, setAlisState] = useState({
                color: '#00f0ff',
                brightness: 85,
                speed: 65,
                mode: 'static',
                runningPattern: 'anim-rainbow-active',
                belangPattern: 'belang-water'
            });

            const [relays, setRelays] = useState({
                biled: true,
                fog: true
            });

            const [stopState, setStopState] = useState({
                color: '#ff334b',
                brightness: 80,
                speed: 60,
                mode: 'static'
            });

            const [toast, setToast] = useState({ msg: '', icon: '' });

            const triggerNotify = (msg, icon = 'fa-bolt-lightning') => {
                setToast({ msg, icon });
            };

            const triggerPassBeamFlash = () => {
                const original = relays.biled;
                let toggleCount = 0;
                const interval = setInterval(() => {
                    setRelays(prev => ({ ...prev, biled: !prev.biled }));
                    toggleCount++;
                    if (toggleCount > 5) {
                        clearInterval(interval);
                        setRelays(prev => ({ ...prev, biled: original }));
                    }
                }, 120);
            };

            const location = useLocation();

            return (
                <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
                    <TopNavSwitcher currentPath={location.pathname} />

                    <Routes>
                        <Route path="/" element={<LoginScreen user={user} setUser={setUser} onNotify={triggerNotify} />} />
                        <Route path="/home" element={<HomeScreen user={user} alisState={alisState} setAlisState={setAlisState} relays={relays} setRelays={setRelays} onNotify={triggerNotify} triggerFlash={triggerPassBeamFlash} />} />
                        <Route path="/alis" element={<AlisScreen user={user} alisState={alisState} setAlisState={setAlisState} relays={relays} setRelays={setRelays} onNotify={triggerNotify} triggerFlash={triggerPassBeamFlash} />} />
                        <Route path="/lamp" element={<LampRelayScreen user={user} relays={relays} setRelays={setRelays} onNotify={triggerNotify} triggerFlash={triggerPassBeamFlash} />} />
                        <Route path="/stoplamp" element={<StoplampScreen user={user} stopState={stopState} setStopState={setStopState} onNotify={triggerNotify} />} />
                        <Route path="/premium" element={<PremiumScreen user={user} setUser={setUser} onNotify={triggerNotify} />} />
                    </Routes>

                    <Toast message={toast.msg} icon={toast.icon} onClose={() => setToast({ msg: '', icon: '' })} />
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = createRoot(rootElement);
        root.render(
            <MemoryRouter initialEntries={["/"]}>
                <App />
            </MemoryRouter>
        );
    </script>
</body>
</html>
